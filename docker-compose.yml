services:
  source.data.unite.net:
    image: ghcr.io/dkfz-unite/unite-data-source:latest
    pull_policy: always
    container_name: unite.data.source
    restart: unless-stopped
    environment:
      UNITE_API_KEY: ${API_KEY}
      UNITE_WORKER_HOST: source.data.unite.net
      UNITE_WORKER_TOKEN: 
      UNITE_PORTAL_HOST: portal.unite.net
      UNITE_CONFIG_PATH: /srv/config
      UNITE_CACHE_PATH: /srv/cache
      UNITE_DATA_PATH: /mnt
      ASPNETCORE_ENVIRONMENT: Release
    ports: 
      - 127.0.0.1:5400:80
    volumes:
      - ./config:/srv/config
      - ./cache:/srv/cache
      - /mnt:/mnt

networks: 
  default:
    name: unite
    external: true
